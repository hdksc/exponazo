<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>非公式EXPO2025脱出ゲーム </title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v3" />
  <link rel="stylesheet" href="map.css?v3" />

  <!-- JS（順番重要） -->
  <script src="timeEngine.js?v1"></script>
  <script src="quizzes.js?v1"></script>
  <script src="komyaku.js?v1"></script>
  <script src="pavilion-data.js?v1"></script>
  <script src="story.js?v1"></script>
  <script src="mapEngine.js?v1"></script>
  <script src="mapSelection.js?v1"></script>
  <script src="quizEngine.js?v1"></script>

  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VCHEJ575KM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VCHEJ575KM');
  </script>
</head>

<body>

  <!-- ★ ステータスバー（最上部固定） -->
  <div id="status-bar">
  <span id="game-title">非公式EXPO2025脱出ゲーム</span>
  <span id="game-keywords">🔑 キーワード：</span>
  </div>
  
  <div id="title-area">
  <div class="title-images">
    <div id="comyaku-left" class="title-sub"></div>
    <img src="img/myaku.png" class="title-main">
    <div id="comyaku-right" class="title-sub"></div>
  </div>
</div>

  <!-- 暗幕 -->
  <div id="screen-dim"></div>

  <!--  中央寄せのラッパー（ここにクイズを入れる） -->
  <div id="page-wrapper">

    <!-- クイズ -->
    <div id="quiz-container"></div>

    <!-- スタンプ帳 -->
    <div class="stamp" style="display: none;">
      <h3>📖 スタンプ帳</h3>
      <ul id="stamp-list"></ul>
      <button onclick="resetProgress()">リセット</button>
    </div>

  </div>




  <!-- ストーリー吹き出し -->
  <div id="story-box" class="speech-bubble" style="display: none;">
    <div id="story-characters" class="title-images" style="display: none;"></div>
    <img id="story-image" src="" alt="" style="display: none;" />
    <p id="story-text"></p>
    <button id="next-button">▶ 次へ</button>
  </div>

  <!-- 地図選択中の常時表示問題パネル -->
  <div id="map-header-panel" class="map-header-hidden">
    <div class="map-prompt-title">問題：僕はどこにいる？</div>
    <div class="map-prompt-desc">これまでに取得したキーワードを並べると、ある光景が浮かびあがる。</div>
    <div class="map-prompt-analysis-label">【現在の解析結果】</div>
    <div id="map-analysis-keywords"></div>
    <div id="map-hint-box" class="map-hint-box"></div>
    <div class="map-header-actions">
      <button id="map-hint-btn" type="button" style="display: none;">ヒントを見る</button>
      <button id="select-all-keywords-btn" type="button" style="display: none;">まるごとせんたく</button>
      <button id="map-cancel-btn" type="button">キャンセル</button>
    </div>
    <div class="map-prompt-instruction">導き出された場所を地図から選択せよ。</div>
    <div id="map-prompt-feedback"></div>
  </div>

  <!-- 地図 -->
  <div id="map" class="map-hidden"></div>

  <!-- 地図下 UI -->
  <div id="map-ui" class="map-ui-hidden">
    <div id="map-ui-text"></div>
    <div class="map-ui-buttons">
      <button id="map-ui-yes">ここで決定</button>
      <button id="map-ui-no">選び直す</button>
    </div>
    <div id="map-ui-result"></div>
  </div>

</body>
</html>
